[package]
name = "hakimi-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "hakimi desktop UI: Slint, Fluent style, one switch and a site list"
build = "build.rs"

[features]
# Offscreen `--shot` rendering is a development aid. Debug builds always keep
# it; release builds include it only when this feature is explicitly enabled.
dev-shot = []

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-default", "renderer-femtovg", "renderer-software", "system-tray", "raw-window-handle-06"] }
# Site logos ship as up-to-96px PNGs but draw at 20px. Pre-resampling them is
# what keeps the logo edges clean; the renderer has no mipmaps of its own.
image = { version = "0.25", default-features = false, features = ["png"] }
hakimi-core = { path = "../hakimi-core" }
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
open = "5"
reqwest.workspace = true
tracing.workspace = true

[build-dependencies]
slint-build = "1.16"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSAppearance", "NSRunningApplication"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
# The login item is a Startup-folder shortcut, so the shell link object is
# created through COM instead of touching the registry.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }
