[package]
name = "hakimi-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "hakimi desktop UI: Slint, Fluent style, one switch and a site list"
build = "build.rs"

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-default", "renderer-femtovg", "renderer-software", "system-tray"] }
hakimi-core = { path = "../hakimi-core" }
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
open = "5"
tracing.workspace = true

[build-dependencies]
slint-build = "1.16"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSAppearance"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
