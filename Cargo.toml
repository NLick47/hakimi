[workspace]
resolver = "2"
members = [
    "crates/hakimi-core",
    "crates/hakimi-cli",
    "crates/hakimi-ffi",
    "crates/hakimi-ui",
    "crates/hakimi-android",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
aws-lc-rs = "1"
base64 = "0.22"
bytes = "1.10"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
hex = "0.4"
http = "1.3"
http-body-util = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hyper = { version = "1.7", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "client", "http1", "http2"] }
idna = "1.0"
parking_lot = "0.12"
rand = "0.9"
rcgen = { version = "0.13", default-features = false, features = [
    "aws_lc_rs",
    "pem",
    "x509-parser",
] }
# `no-provider` keeps rustls on the single aws-lc-rs provider instead of also
# compiling ring; hakimi-core installs aws-lc-rs as the process default.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-webpki-roots-no-provider",
    "http2",
    "json",
] }
rustls = { version = "0.23", default-features = false, features = [
    "aws_lc_rs",
    "prefer-post-quantum",
    "std",
    "tls12",
] }
socket2 = "0.6"
rustls-pki-types = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1.48", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "io-util",
    "sync",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "aws_lc_rs",
    "tls12",
] }
tower-service = "0.3"
tracing = "0.1"
# EnvFilter/ANSI are desktop-only conveniences; Android adds neither.
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "json",
    "std",
] }
url = "2.5"
webpki-roots = "1.0"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

# Dependencies are size-optimised (and still fast enough); the workspace's own
# code keeps opt-level 3 where the hot proxy path lives.
[profile.release.package."*"]
opt-level = "s"

# Desktop UI only: panic=abort removes the unwinding tables from the final
# binary. This is a separate profile so `release` keeps unwind for the C ABI
# (`hakimi-ffi` uses catch_unwind) and Android keeps it for the JNI shell.
[profile.desktop-release]
inherits = "release"
panic = "abort"
strip = "symbols"
lto = "fat"
codegen-units = 1

[profile.desktop-release.package."*"]
opt-level = "s"

# Android ships inside an APK, so it trades throughput for size. Panic
# strategy stays `unwind`: the JNI shell uses `catch_unwind` to turn a panic
# into an error instead of killing the app process.
[profile.android-release]
inherits = "release"
opt-level = "z"
strip = "symbols"
lto = "fat"
codegen-units = 1

[profile.android-release.package."*"]
opt-level = "z"

[profile.dev]
# Large debug-info rlibs exhaust the Windows page file on constrained machines.
debug = 0

[profile.test]
debug = 0
